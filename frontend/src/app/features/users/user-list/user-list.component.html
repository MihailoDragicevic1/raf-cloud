<div class="user-list-container">
  <h2>Korisnici</h2>

  <div *ngIf="!authService.hasPermission('can_read_users')" class="no-permission">
    <p>Nemate dozvolu za pristup prikazu korisnika.</p>
  </div>

  <div *ngIf="authService.hasPermission('can_read_users')">
    <div class="actions" *ngIf="authService.hasPermission('can_create_users')">
      <button mat-raised-button color="primary" (click)="openAddUserDialog()">
        Dodaj korisnika
      </button>
    </div>

    <table mat-table [dataSource]="users" class="mat-elevation-z2 full-width-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">{{ user.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Ime</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="lastname">
        <th mat-header-cell *matHeaderCellDef>Prezime</th>
        <td mat-cell *matCellDef="let user">{{ user.lastname }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Uloga</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let user">
          <button *ngIf="authService.hasPermission('can_update_users')" mat-icon-button color="primary" (click)="openEditUserDialog(user)" aria-label="Izmeni korisnika">
            <mat-icon>edit</mat-icon>
          </button>

          <button *ngIf="authService.hasPermission('can_destroy_users')" mat-icon-button color="warn" (click)="deleteUser(user.id)" aria-label="Obriši korisnika">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
