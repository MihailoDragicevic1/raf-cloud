<div class="add-machine-container">
  <h2>Dodaj novu mašinu</h2>

  <form [formGroup]="machineForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Naziv mašine</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="machineForm.invalid">
      Sačuvaj
    </button>
    <button mat-stroked-button color="warn" routerLink="/machines">Otkaži</button>
  </form>
</div>
